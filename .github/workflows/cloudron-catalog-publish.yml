name: Publish Cloudron Catalog

# Managed caller: the reusable preflight validates the catalog with the real
# pinned CLI and builds PR images without publishing them.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudron-catalog-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  catalog:
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    uses: marcusquinn/aidevops/.github/workflows/cloudron-catalog-publish-reusable.yml@4366037537f8a9aaf7f738a37465a6b1433dd6d5
    with:
      aidevops_ref: 4366037537f8a9aaf7f738a37465a6b1433dd6d5
      image_repository: ghcr.io/marcusquinn/cloudron-buzz-app
      cli_version: '8.2.6'
      cli_integrity: sha512-LHd+4u6pJxDtHX1JuVuWqrUuTbkDu+iH4jjNWW6JgB4+iDLusp08rpt6gifTFPbQjbCZHhnD8LbAGzM1NzDCXw==
      package_checks: |
        ./test/package-test.sh
        # Public upstream metadata verification needs no publication credential.
        ./test/verify-buzz-image.sh
        # Preserve the package-specific runtime check before any publication.
        docker build --platform linux/amd64 --tag cloudron-buzz-app:test .
        ./test/pairing-proxy-test.sh cloudron-buzz-app:test
    secrets:
      CLOUDRON_RELEASE_PAT: ${{ secrets.CLOUDRON_RELEASE_PAT }}
